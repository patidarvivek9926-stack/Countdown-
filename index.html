<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Down to November 13 ✨</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #f6d365 100%);
            background-size: 200% 200%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Hearts Background */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.15);
            z-index: 2;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.7);
            color: #d63384;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: #b02a6f;
            margin-bottom: 12px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        p.quote {
            color: #5a2a42;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Countdown Grid */
        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            padding: 18px 8px;
            box-shadow: 0 8px 20px rgba(176, 42, 111, 0.08);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
        }

        .time-box span.number {
            display: block;
            font-size: 2.2rem;
            font-weight: 600;
            color: #d63384;
            line-height: 1;
            margin-bottom: 6px;
        }

        .time-box span.label {
            font-size: 0.75rem;
            color: #7a425d;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .footer-note {
            font-size: 0.95rem;
            color: #8c3b63;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.5);
            padding: 12px 20px;
            border-radius: 14px;
            display: inline-block;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2.5rem;
            }
            p.quote {
                font-size: 0.9rem;
            }
            .countdown {
                gap: 8px;
            }
            .time-box {
                padding: 14px 4px;
            }
            .time-box span.number {
                font-size: 1.6rem;
            }
            .time-box span.label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Floating Elements -->
    <div class="hearts-container" id="hearts-container"></div>

    <!-- Main Content Card -->
    <div class="card">
        <div class="badge">✨ November 13, 2026 ✨</div>
        <h1>Counting Down the Moments...</h1>
        <p class="quote">
            Distance means so little when my favorite person means so much. 
            Can't wait to finally see you, laugh over endless stories, and make the best memories together! 🌸🤍
        </p>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <div class="footer-note" id="status-note">
            See you super soon, Bestie! 🫶✨
        </div>
    </div>

    <script>
        // Set target date: November 13, 2026 at 00:00:00 (Change time if you have a specific meeting hour, e.g., '2026-11-13T11:00:00')
        const targetDate = new Date('2026-11-13T00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = targetDate - now;

            if (gap <= 0) {
                document.getElementById('countdown').innerHTML = `
                    <div style="grid-column: span 4; background: rgba(255,255,255,0.8); padding: 20px; border-radius: 18px; color: #d63384; font-size: 1.5rem; font-weight: 600;">
                        🎉 The wait is finally over! Today is the day we meet! 🥳💖
                    </div>
                `;
                document.getElementById('status-note').innerText = "Best Day Ever! ✨";
                return;
            }

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            const d = Math.floor(gap / day);
            const h = Math.floor((gap % day) / hour);
            const m = Math.floor((gap % hour) / minute);
            const s = Math.floor((gap % minute) / second);

            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Floating Hearts & Sparkles Generator
        const container = document.getElementById('hearts-container');
        const symbols = ['🤍', '💖', '✨', '🌸', '🫶'];

        function createHeart() {
            const el = document.createElement('div');
            el.classList.add('heart');
            el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 16 + 14) + 'px';
            el.style.animationDuration = (Math.random() * 4 + 5) + 's';
            container.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 9000);
        }

        setInterval(createHeart, 450);
    </script>
</body>
</html>
